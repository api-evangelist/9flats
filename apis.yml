aid: 9flats
name: 9flats
description: '9flats is a European vacation-rental marketplace, founded in Hamburg, Germany in 2010, that
  lists privately-owned apartments, houses and rooms for short-term stays and takes bookings directly
  from travellers. It operates 9flats.com in multiple languages and, in 2016, combined with its Berlin-based
  competitor Wimdu. 9flats published a public read API (v1, later v3) covering place search, place detail,
  photos, prices, reviews, availability calendars, user profiles, favourites and bookings, authenticated
  with OAuth 1.0a and shipped with a first-party Ruby SDK. That developer surface has decayed: the SDK
  was last released in 2011 and is marked unsupported by its own maintainers, and the API reference site
  the SDK links to has been deleted.'
