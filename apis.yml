apis:
- aid: 9flats:9flats-api
  name: 9flats API
  description: 'The 9flats read API over the marketplace''s listing data: search places, fetch a place
    with its photos, prices, reviews and monthly availability calendar, and fetch a user with their favourites
    and (for the authenticated user) their bookings. Authenticated with OAuth 1.0a plus a client_id query
    parameter; responses are JSON envelopes keyed by resource name with links[] rel/href navigation and
    page-number pagination. Nine operations, all GET — no write surface is published. Reconstructed from
    9flats'' own client library, because the reference site the library points at has been withdrawn.'
