  knows, run 2026-09-05 with a desktop-browser User-Agent.
description: >-
  NO DOCUMENT WAS RETRIEVED, AND NO ABSENCE WAS ESTABLISHED EITHER. Every 9flats
  host that exists is proxied by Cloudflare with a managed challenge in front of
  it: each path below answered HTTP 403 with `cf-mitigated: challenge` and a
  "Just a moment..." interstitial body, for the site root as much as for
  /.well-known/. The 403s are therefore the edge answering, not the origin — they
  are NOT evidence that 9flats does or does not serve these documents. We do not
  evade challenges, so this surface is unmeasured. No WellKnown or SecurityTxt
  pointer is emitted, because nothing was served.
