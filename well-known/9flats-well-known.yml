control_probe:
  description: >-
    Subdomain control, to stop a wildcard catch-all being read as a live developer
    surface. developer.9flats.com, partners.9flats.com and help.9flats.com all
    resolve to 195.201.174.168 and return an Apache "403 Forbidden" — and so does
    nonexistent-xyz.9flats.com, which cannot exist. Those three hostnames are the
    wildcard, not developer properties.
  probes:
    - url: https://developer.9flats.com/
      status: 403
      body: Apache 403 Forbidden
    - url: https://partners.9flats.com/
      status: 403
      body: Apache 403 Forbidden
    - url: https://help.9flats.com/
      status: 403
      body: Apache 403 Forbidden
    - url: https://nonexistent-xyz.9flats.com/
      status: 403
      body: Apache 403 Forbidden (control — proves the wildcard)
